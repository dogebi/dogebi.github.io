<!-- 2.1 세션 시작 전체 시퀀스를 보여주는 독립 컴포넌트 아키텍처 뷰 -->
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>组件架构 · 端到端启动时序</title>
  <style>
    :root { --bg: #eef1f6; --panel: #ffffff; --ink: #1f2733; --muted: #5b6675; --line: #dde3ec; --brand: #274690; --brand2: #3b5bdb; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; line-height: 1.7; }
    main { max-width: 1240px; margin: 0 auto; padding: 48px 26px 72px; }
    .kicker { color: var(--brand2); font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 10px 0 8px; color: var(--brand); font-size: clamp(28px, 4vw, 42px); line-height: 1.2; }
    .intro { margin: 0 0 24px; color: var(--muted); }
    .diagram { overflow-x: auto; padding: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 24px rgba(16, 24, 40, .08); }
    .diagram svg { display: block; min-width: 820px; width: 100%; height: auto; }
    .caption { margin: 12px 0 0; color: var(--muted); font-size: 13px; font-weight: 600; text-align: center; }
  </style>
</head>
<body>
  <main>
    <div class="kicker">Component architecture</div>
    <h1>业务逻辑架构</h1>
    <p class="intro">展示 ESM 平台、Redis、AgentEngine、MasterAgent 与 LLM/工具之间的会话启动、工具执行和 SSE 回传链路。</p>
    <div class="diagram">
      <svg viewBox="0 0 1120 560" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif">
        <defs><marker id="s1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0e7490"/></marker>
        <marker id="s2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4338ca"/></marker></defs>
        <g font-size="12.5" font-weight="800" text-anchor="middle">
          <rect x="40" y="16" width="150" height="34" rx="8" fill="#0f766e"/><text x="115" y="38" fill="#fff">ESM 平台</text>
          <rect x="250" y="16" width="150" height="34" rx="8" fill="#c2410c"/><text x="325" y="38" fill="#fff">Redis</text>
          <rect x="460" y="16" width="170" height="34" rx="8" fill="#4338ca"/><text x="545" y="38" fill="#fff">AgentEngine</text>
          <rect x="690" y="16" width="160" height="34" rx="8" fill="#7c3aed"/><text x="770" y="38" fill="#fff">MasterAgent</text>
          <rect x="910" y="16" width="170" height="34" rx="8" fill="#475569"/><text x="995" y="38" fill="#fff">LLM / 工具</text>
        </g>
        <g stroke="#e2e8f0" stroke-width="1.5"><line x1="115" y1="50" x2="115" y2="540"/><line x1="325" y1="50" x2="325" y2="540"/><line x1="545" y1="50" x2="545" y2="540"/><line x1="770" y1="50" x2="770" y2="540"/><line x1="995" y1="50" x2="995" y2="540"/></g>
        <g font-size="11.5" fill="#334155">
          <line x1="115" y1="80" x2="325" y2="80" stroke="#0e7490" stroke-width="2" marker-end="url(#s1)"/><text x="220" y="74" text-anchor="middle">① XADD stream:agent_tasks（agent_execute payload）</text>
          <line x1="325" y1="112" x2="545" y2="112" stroke="#4338ca" stroke-width="2" marker-end="url(#s2)"/><text x="435" y="106" text-anchor="middle">② TaskWorker 消费 → handle_agent_task</text>
          <text x="560" y="134" font-size="11" fill="#64748b">加载 PG session+历史 · 建占位 assistant 消息 · 发 message_start</text>
          <rect x="500" y="150" width="90" height="26" rx="6" fill="#eef2ff"/><text x="545" y="167" text-anchor="middle" font-size="10.5" fill="#4338ca">load_agent(6 SQL)</text>
          <rect x="470" y="184" width="150" height="26" rx="6" fill="#fff7ed"/><text x="545" y="201" text-anchor="middle" font-size="10.5" fill="#9a3412">注入核心工具 + 文件工具</text>
          <rect x="455" y="218" width="180" height="30" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/><text x="545" y="238" text-anchor="middle" font-size="10.5" fill="#15803d" font-weight="700">③ asyncio.gather：知识库检索 ∥ 记忆检索</text>
          <rect x="470" y="258" width="150" height="26" rx="6" fill="#f5f3ff"/><text x="545" y="275" text-anchor="middle" font-size="10.5" fill="#7c3aed">④ 上下文压缩 build_context</text>
          <line x1="545" y1="300" x2="770" y2="300" stroke="#4338ca" stroke-width="2" marker-end="url(#s2)"/><text x="655" y="294" text-anchor="middle">⑤ build_master_prompt + 构建工具集</text>
          <rect x="700" y="316" width="150" height="40" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/><text x="775" y="333" text-anchor="middle" font-size="10.5" fill="#7c3aed" font-weight="700">⑥ 有界多轮工具循环</text><text x="775" y="348" text-anchor="middle" font-size="10" fill="#6d5fa0">≤8 轮 · 退化重试 ×2</text>
          <line x1="770" y1="366" x2="995" y2="388" stroke="#0e7490" stroke-width="1.8" marker-end="url(#s1)"/><text x="900" y="374" text-anchor="middle" font-size="10.5">⑦ LLM 调用（带 tools schema）</text>
          <line x1="995" y1="388" x2="770" y2="410" stroke="#475569" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#s1)"/><text x="900" y="402" text-anchor="middle" font-size="10.5">tool_calls / 正文（流式）</text>
          <rect x="700" y="416" width="150" height="30" rx="6" fill="#fff7ed" stroke="#fdba74"/><text x="775" y="435" text-anchor="middle" font-size="10.5" fill="#9a3412">⑧ 执行工具（本地/远程/派发）</text>
          <rect x="700" y="452" width="150" height="30" rx="6" fill="#fdf2f8" stroke="#fbcfe8"/><text x="775" y="471" text-anchor="middle" font-size="10.5" fill="#be185d">派发 → Executor DAG 子Agent</text>
          <line x1="770" y1="488" x2="545" y2="510" stroke="#4338ca" stroke-width="2" marker-end="url(#s2)"/><text x="655" y="482" text-anchor="middle">⑨ 汇总子 Agent 结果 → 最终回答</text>
          <line x1="545" y1="526" x2="325" y2="526" stroke="#0e7490" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#s1)"/><text x="435" y="520" text-anchor="middle">⑩ PUBLISH 事件（chunk/tool/thinking/end）</text>
          <line x1="325" y1="526" x2="115" y2="526" stroke="#0f766e" stroke-width="2" marker-end="url(#s1)"/><text x="220" y="520" text-anchor="middle" fill="#0f766e">SSE 转发给前端 + 异步记忆提取</text>
        </g>
      </svg>
      <p class="caption">图 4 · 会话启动端到端时序（ESM → Redis → 引擎 → Master → LLM/工具 → SSE 回传）</p>
    </div>
  </main>
</body>
</html>
