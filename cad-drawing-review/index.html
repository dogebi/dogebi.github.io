<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手绘图与建筑图纸对照</title>
<meta name="description" content="上传同一楼层的建筑图纸和手绘图，识别文字、对照差异，并导出带红色复核区域的标注 PDF。">
<meta property="og:title" content="手绘图与建筑图纸对照">
<meta property="og:description" content="识别图纸与手绘图中的房间名和尺寸，标出只在其中一侧出现的文字。">
<script>
  (function () {
    try {
      var saved = localStorage.getItem('cad.theme');
      var mode = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = mode;
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body><main>
<header><div><h1 data-i18n="title"></h1><p data-i18n="intro"></p></div>
<div class="controls">
<label><span data-i18n="language"></span> <select id="language">
<option value="zh-CN" lang="zh-CN">简体中文</option>
<option value="ko" lang="ko">한국어</option>
<option value="en" lang="en">English</option>
<option value="ja" lang="ja">日本語</option>
</select></label>
<button id="theme-toggle" class="theme" type="button" aria-pressed="false">深色</button>
</div></header>

<ol class="steps">
<li data-i18n="step1"></li>
<li data-i18n="step2"></li>
<li data-i18n="step3"></li>
<li data-i18n="step4"></li>
</ol>

<p id="local-info" hidden><span data-i18n="localNotice"></span> <a id="local-app" data-i18n="localApp"></a></p>
<form id="compare">
<div class="panels">
<section><h2 data-i18n="drawing"></h2><label><span data-i18n="pdf"></span> <input id="pdf" name="pdf" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,application/pdf,image/png,image/jpeg,image/webp" required></label>
<label><span data-i18n="page"></span> <input id="page" name="page" type="number" min="1" value="1" required></label>
<iframe id="drawing" hidden></iframe><img id="drawing-image" alt="" hidden></section>
<section><h2 data-i18n="sketch"></h2><label><span data-i18n="image"></span> <input id="image" name="image" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,application/pdf,image/png,image/jpeg,image/webp" required></label>
<label><span data-i18n="page"></span> <input id="sketch-page" name="sketch_page" type="number" min="1" value="1" required></label>
<iframe id="sketch-pdf" hidden></iframe><img id="sketch-image" alt="" hidden></section>
</div>
<p id="anchors" hidden><span id="anchor-help"></span> <button id="clear-anchors" type="button" data-i18n="clearAnchors"></button></p><div class="actions compare-actions"><button class="primary" id="submit" data-i18n="compare"></button><a id="download" download="annotated-plan.pdf" data-i18n="download" hidden></a></div>
<p id="status" role="status"></p>
<div id="results" class="panels" hidden>
<section><h2 data-i18n="drawingOnly"></h2><ul id="drawing-only"></ul></section>
<section><h2 data-i18n="sketchOnly"></h2><ul id="sketch-only"></ul></section>
</div>
</form>
</main><script type="module" src="compare.mjs"></script></body></html>
