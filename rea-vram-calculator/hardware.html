<body class="catalog-page" data-catalog="hardware">
<div class="app-shell">
<header class="topbar">
<a class="wordmark" href="./">dogebi</a>
<nav class="site-nav" aria-label="主导航">
<a href="./models.html">大模型</a>

<main class="workspace">
<h1>硬件目录</h1>
<p class="catalog-intro">比较计算器支持的设备预设，并用所选配置估算显存与性能。</p>
<form class="catalog-filters">
<label>搜索<input id="catalog-search" type="search" placeholder="例如 RTX 4090"></label>
<label>品牌<select id="catalog-vendor"><option value="">全部</option></select></label>
<label>最低内存<select id="catalog-min"><option value="0">不限</option><option value="16">16 GB</option><option value="24">24 GB</option><option value="48">48 GB</option><option value="96">96 GB</option></select></label>
<label>排序<select id="catalog-sort"><option value="default">默认</option><option value="name">名称</option><option value="desc">内存从高到低</option><option value="asc">内存从低到高</option></select></label>
<button type="reset">清除筛选</button>
</form>
<p id="catalog-source-status" role="status"></p><p id="catalog-status" role="status"></p>
<div class="catalog-table-wrap" tabindex="0" role="region" aria-label="硬件规格">
<table class="catalog-table">
<thead><tr><th scope="col">设备</th><th scope="col">内存类型</th><th scope="col">容量</th><th scope="col">带宽</th><th scope="col">厂商功耗规格</th><th scope="col">估算</th></tr></thead>
<tbody id="catalog-rows"></tbody>
</table>
</div>
<p class="catalog-note"><a href="https://github.com/DarkStark9000/gpu-specs">gpu-specs · Debarshi Das · CC BY 4.0</a></p>
