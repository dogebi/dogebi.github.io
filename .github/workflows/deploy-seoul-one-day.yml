name: deploy seoul-one-day
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch mirror from source repo
        run: |
          git clone --depth 1 https://github.com/dogebi/seoul-one-day.git /tmp/src
          mkdir -p seoul-one-day
          rsync -a --delete --exclude '.git' --exclude '.github' --exclude '_evidence' --exclude '.bootstrap' /tmp/src/ seoul-one-day/
          rm -f seoul-one-day/.bootstrap
          du -sh seoul-one-day && find seoul-one-day -type f | wc -l
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add -A seoul-one-day
          git diff --cached --quiet || git commit -m "deploy: seoul-one-day 미러 갱신"
          git push
